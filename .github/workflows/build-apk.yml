name: Build & Release Infinite Speed APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore Debug Keystore for Signing
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from base64"
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      - name: Setup Environment & Google Services
        run: |
          touch .env
          if [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"infinite-speed","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.infinitespeed.app"}}}]}' > app/google-services.json
          fi

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Output APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/InfiniteSpeed-v1.0.apk
          ls -lh release-output/InfiniteSpeed-v1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteSpeed-APK
          path: release-output/InfiniteSpeed-v1.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/InfiniteSpeed-v1.0.apk
          name: "Infinite Speed v1.0.0"
          tag_name: "v1.0.0"
          body: |
            ### ⚡ Infinite Speed - Offline Android File Transfer

            **Direct Download:** Click `InfiniteSpeed-v1.0.apk` below to download and install directly on your Android phone.

            #### Features:
            - 🚀 **High Speed Offline Transfer:** Up to maximum Wi-Fi hardware limit without internet or mobile data.
            - 📡 **Instant Discovery:** Dual-layer UDP broadcast beacon + Android NSD.
            - 🛡️ **SHA-256 Verified:** Full cryptographic stream checksums prevent corrupted files.
            - 📱 **Intelligent File Manager:** Photos, Videos, Music, Documents, Archives, and installed APK sharing.
            - 🌐 **Web Share Portal:** Transfer to/from any browser on PC, Mac, Linux, or iPhone (`http://<ip>:8990/web`).
            - 👥 **Group Sharing Rooms:** Multi-user temporary broadcast rooms.
            - 💾 **Room SQLite Persistence:** Complete audit history for all transfers.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
