name: Build & Release Infinite Speed APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.1 & Kotlin 2.2)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Restore Debug Keystore for Signing
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new fallback debug.keystore"
          fi

      - name: Setup Environment Files & Google Services Config
        run: |
          touch .env
          if [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"infinite-speed","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.infinitespeed.app"}}}]}' > app/google-services.json
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/InfiniteSpeed-v1.0.apk
          ls -lh release-output/InfiniteSpeed-v1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteSpeed-APK
          path: release-output/InfiniteSpeed-v1.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/InfiniteSpeed-v1.0.apk
          name: "Infinite Speed v1.0.0"
          tag_name: "v1.0.0"
          body: |
            ### ⚡ Infinite Speed - Production Android File Sharing
            
            **Direct Download:** Click `InfiniteSpeed-v1.0.apk` below to download and install on your Android device.
            
            #### Core Features:
            - 🚀 **Zero Data / Offline Sharing:** High-speed peer-to-peer file transfer over Wi-Fi Direct and Local Hotspots.
            - 📡 **Dual Peer Discovery:** Active UDP broadcast beacon (port 8988) + Android NSD (mDNS) for instant detection.
            - 🛡️ **Cryptographic Verification:** SHA-256 integrity checks computed during streaming.
            - 🔒 **Security:** Sanitized file paths preventing directory traversal attacks.
            - 📱 **Intelligent File Browser:** Photos, Videos, Audio, Documents, Archives, and installed APK app sharing.
            - 🌐 **Web Share Portal:** Single-page web server (`http://<device-ip>:8990/web`) to share with PC, Mac, Linux, or iOS browsers.
            - 👥 **Group Sharing Rooms:** Multi-recipient broadcast transfers with PIN protection.
            - 💾 **Room SQLite Persistence:** Complete transfer history records and stats.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
