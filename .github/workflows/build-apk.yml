name: Build & Release Infinite Speed APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew || true

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/InfiniteSpeed-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteSpeed-APK
          path: release-output/InfiniteSpeed-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/InfiniteSpeed-v1.0.apk
          name: "Infinite Speed ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ### ⚡ Infinite Speed - Fast Offline File Transfer for Android
            
            **Download the attached APK below to install on your Android device.**
            
            #### Features:
            - 🚀 Ultra-fast offline Wi-Fi & Hotspot file sharing (no internet required).
            - 📡 Dual peer discovery (UDP beacon + Android NSD).
            - 🛡️ SHA-256 cryptographic stream verification.
            - 📱 Intelligent file manager with Photos, Videos, Audio, Docs, and APK app sharing.
            - 🌐 Zero-install Web Share portal (`http://<ip>:8990/web`) for PC, Mac, and iPhone.
            - 👥 Group sharing rooms for multi-device broadcasts.
            - 💾 Room SQLite persistent transfer history.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
